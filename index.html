.habit.on{background:var(--main);border-color:var(--main)}

.habit .st{font-size:11px;color:var(--muted);margin-top:2px}

.habit .mk{font-size:20px;line-height:1;color:#D81B60}

.cup.on{background:var(--main);color:#fff;border-color:var(--main)}

.pbar>i{display:block;height:100%;background:var(--main);border-radius:6px;transition:width .3s}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;

.split{display:flex;justify-content:space-between;align-items:center;gap:8px}

function setTheme(k){

let D = defaults();
function load(){
  try{

      const o = JSON.parse(raw);
      const d = defaults();
      for(const k in d){ if(o[k] !== undefined) d[k] = o[k]; }
      D = d;
    }
  }catch(e){ D = defaults(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }
  catch(e){ toast('保存失败：手机存储空间不足'); }
}
let toastTimer;
function toast(msg){

  return {i: i, q: QUOTES[i]};

/* ---------- 打卡 ---------- */
function streak(h){
  let n = 0, d = new Date();
  while(true){
    const k = ymd(d);
    if((D.habit_done[k]||[]).includes(h)){ n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function viewHabits(){
  const done = D.habit_done[today()] || [];
  const total = D.habits.length;
  return `
  <div class="card"><h2>今日打卡 <span class="muted">${done.filter(h=>D.habits.includes(h)).length}/${total}</span></h2>
    <div class="body"><div class="grid3">
      ${D.habits.map(h=>{
        const on = done.includes(h);
        return `<div class="habit ${on?'on':''}" onclick="toggleHabit('${esc(h).replace(/'/g,'&#39;')}')">
          <div class="mk">${on?'✓':'○'}</div>
          <div class="nm">${esc(h)}</div>
          <div class="st">连续 ${streak(h)} 天</div>
        </div>`;
      }).join('')}
    </div></div>
  </div>
  <div class="card"><h2>最近 14 天</h2><div class="body">
    ${heat14(total)}
    <div class="muted" style="margin-top:8px">颜色越深，当天完成的习惯越多</div>
  </div></div>`;
}
function heat14(total){
  const cells = [];
  for(let i=13;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = ymd(d);
    const n = (D.habit_done[k]||[]).filter(h=>D.habits.includes(h)).length;
    const r = total ? n/total : 0;
    const c = r === 0 ? '#F7F7F7' : r < .34 ? '#FCE4EC' : r < .67 ? '#F8BBD0' : r < 1 ? '#F06292' : '#EC407A';
    cells.push(`<div style="text-align:center">
      <div style="height:34px;border-radius:7px;background:${c}"></div>
      <div class="muted" style="font-size:10px;margin-top:3px">${d.getMonth()+1}/${d.getDate()}</div>
    </div>`);
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">${cells.join('')}</div>`;
}
function toggleHabit(name){
  const k = today();
  const arr = D.habit_done[k] || (D.habit_done[k] = []);
  const i = arr.indexOf(name);
  if(i >= 0) arr.splice(i,1); else arr.push(name);
  save(); render();
}

    <div class="cups">

    </div>
  </div></div>

    ${(D.weight_records||[]).slice(-10).reverse().map(r=>`<div class="item">
      <span class="muted" style="min-width:82px">${esc(r.date)}</span>
      <span class="t"><b>${esc(r.weight)} kg</b></span>
      <button class="mini ghost" onclick="delWeight('${esc(r.date)}')">删</button>
    </div>`).join('') || `<div class="empty">还没有记录。</div>`}
  </div></div>`;
}
function spark(recs, target){
  if(recs.length < 2) return `<div class="empty">至少记录 2 次后显示趋势线。</div>`;
  const vals = recs.map(r=>Number(r.weight));
  const all = vals.concat([Number(target)]);
  const lo = Math.min(...all) - 1, hi = Math.max(...all) + 1;
  const W = 320, H = 120, PL = 8, PR = 8, PT = 10, PB = 16;
  const x = i => PL + (W-PL-PR) * i / (recs.length-1);
  const y = v => PT + (H-PT-PB) * (1 - (v-lo)/(hi-lo));
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ty = y(Number(target));
  return `<svg class="spark" viewBox="0 0 ${W} ${H}">
    <line x1="${PL}" y1="${ty}" x2="${W-PR}" y2="${ty}" stroke="#F48FB1" stroke-dasharray="4 4" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="#EC407A" stroke-width="2.2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="#EC407A"/>`).join('')}
    <text x="${PL}" y="${H-4}" font-size="9" fill="#8A6D7C">${esc(recs[0].date.slice(5))}</text>
    <text x="${W-PR-34}" y="${H-4}" font-size="9" fill="#8A6D7C">${esc(recs[recs.length-1].date.slice(5))}</text>
  </svg>`;
}
function addWeight(){
  const el = document.getElementById('wv');
  const v = parseFloat(el.value);
  if(!v || v < 30 || v > 150){ toast('请输入有效体重'); return; }
  const k = today();
  const arr = D.weight_records || (D.weight_records = []);
  const idx = arr.findIndex(r=>r.date === k);
  if(idx >= 0) arr[idx].weight = v; else arr.push({date:k, weight:v});
  arr.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  save(); render(); toast('已记录 ' + v + 'kg');
}
function delWeight(date){
  D.weight_records = (D.weight_records||[]).filter(r=>r.date !== date);
  save(); render();
}
function setWater(n){
  const k = today();
  const cur = D.water[k] || 0;
  D.water[k] = (cur === n) ? n-1 : n;
  save(); render();
}

    <div class="muted" style="margin-top:8px">提醒以电脑版为准；要让 iPhone 到点弹通知，用电脑版导出 .ics 加到系统日历。</div>
  </div></div>

  <div class="card"><h2>配色</h2><div class="body">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${Object.entries(THEMES).map(([k,t])=>`
        <div style="text-align:center">
          <div onclick="setTheme('${k}')" style="width:46px;height:46px;border-radius:12px;
            background:${t.dot};border:2px solid ${(D.settings.theme||'sakura')===k?'#333':'transparent'}"></div>
          <div class="muted" style="font-size:10px;margin-top:3px">${t.name}</div>
        </div>`).join('')}
    </div>
  </div></div>

  <div class="card"><h2>数据</h2><div class="body">
    <div class="muted" style="margin-bottom:10px">数据只存在这台手机里，不上传。换手机或和电脑同步时用这两个按钮。</div>
    <button onclick="exportJson()" style="width:100%">导出备份（.json）</button>
    <input type="file" accept=".json,application/json" onchange="importJson(event)" style="display:none" id="imp">
    <button style="width:100%;margin-top:8px" onclick="document.getElementById('imp').click()">从备份恢复</button>
  </div></div>

  <div class="card"><h2>关于</h2><div class="body">
    <div class="muted" style="line-height:1.7">
      Jacqueline 工作台 · 手机版<br>
      纯离线，数据保存在本机浏览器<br>
      和电脑版用同一套数据格式，可互相导入
    </div>
  </div></div>`;
}
let moodSel = 0;
function setMood(s){
  const k = today();
  const cur = D.moods[k] || {score:0,note:''};
  const val = cur.score === s ? 0 : s;
  const mn = document.getElementById('mn');
  D.moods[k] = {score:val, note: mn ? mn.value.trim() : (cur.note||'')};
  save();
  const btns = document.querySelectorAll('#app .card:first-child .body .row button');
  btns.forEach((b,i)=>b.className = (i+1===val) ? 'pri' : '');
}
function saveDiary(){
  const k = today();
  const txt = document.getElementById('dl').value;
  const mn = document.getElementById('mn').value.trim();
  if(txt.trim()) D.daily_logs[k] = txt; else delete D.daily_logs[k];
  const score = (D.moods[k]||{}).score || 0;
  if(score || mn) D.moods[k] = {score, note:mn}; else delete D.moods[k];
  save(); toast('已保存');
}

/* ---------- 导入导出 ---------- */
function exportJson(){
  const txt = JSON.stringify(D, null, 2);
  const blob = new Blob([txt], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `工作台备份_${today()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  toast('已导出到「文件」App');
}
function importJson(ev){
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || typeof o !== 'object') throw new Error('格式不对');
      if(!confirm('导入会用备份里的内容覆盖手机上的数据，继续？')) return;
      const d = defaults();
      for(const k in d){ if(o[k] !== undefined) d[k] = o[k]; }
      D = d; save(); applyTheme(D.settings.theme || 'sakura'); render(); toast('已恢复');
    }catch(e){ toast('导入失败：不是有效备份'); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

/* ---------- 启动 ---------- */
document.getElementById('tabs').addEventListener('click', e=>{
  const a = e.target.closest('a[data-tab]');
  if(!a) return;
  e.preventDefault();
  go(a.dataset.tab);
});
load();
applyTheme((D.settings && D.settings.theme) || 'sakura');
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
